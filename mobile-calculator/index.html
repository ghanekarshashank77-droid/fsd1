<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="calculator-container">
        <div class="display-area">
            <div class="previous-value" id="previous-operand"></div>
            <div class="current-value" id="current-operand">0</div>
        </div>
        <div class="buttons-grid">
            <!-- Row 1 -->
            <button class="btn number" data-number>7</button>
            <button class="btn number" data-number>8</button>
            <button class="btn number" data-number>9</button>
            <button class="btn operator" data-action="multiply">×</button>

            <!-- Row 2 -->
            <button class="btn number" data-number>4</button>
            <button class="btn number" data-number>5</button>
            <button class="btn number" data-number>6</button>
            <button class="btn operator" data-action="subtract">−</button>

            <!-- Row 3 -->
            <button class="btn number" data-number>1</button>
            <button class="btn number" data-number>2</button>
            <button class="btn number" data-number>3</button>
            <button class="btn operator" data-action="add">+</button>

            <!-- Row 4 -->
            <button class="btn operator text-btn" data-action="clear">CE</button>
            <button class="btn number" data-number>0</button>
            <button class="btn equals" data-action="equals">=</button>
            <button class="btn operator" data-action="divide">÷</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
